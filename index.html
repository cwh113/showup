<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Show Up">
<meta name="theme-color" content="#f5f0e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Show Up</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inconsolata:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#f5f0e8; --paper2:#ede8df; --paper3:#e4ddd1;
  --ink:#1a1714; --ink2:#3d3830; --ink3:#6b6358; --ink4:#a09890;
  --rule:#d8d0c4; --rule2:#c8bfb4;
  --flame:#e8590c; --flame2:#ffb347; --flameSoft:#fbe3d2;
  --ice:#3b82c4; --iceSoft:#dceaf6;
  --go:#2a7a4a; --goSoft:#dcefe2;
  --warn:#b4482a;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:'Inconsolata',ui-monospace,monospace;font-size:15px;line-height:1.45;min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--ink2)}
.serif{font-family:'Lora',Georgia,serif}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}
.muted{color:var(--ink3)}
.small{font-size:12.5px}

.view{display:none;padding:calc(var(--safe-top) + 18px) 18px calc(var(--safe-bottom) + 92px);max-width:560px;margin:0 auto}
.view.active{display:block}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:var(--paper2);font-weight:700;font-size:14px}
.chip.flame{background:var(--flameSoft);color:var(--flame)}
.chip.ice{background:var(--iceSoft);color:var(--ice)}
.chip.dim{opacity:.45;filter:grayscale(1)}

/* cards */
.card{background:#fffdf8;border:1px solid var(--rule);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-family:'Lora',serif;font-weight:500;font-size:22px;line-height:1.2}
.card h3{font-family:'Lora',serif;font-weight:500;font-size:16px;margin-bottom:8px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--paper2);color:var(--ink3)}
.badge.go{background:var(--goSoft);color:var(--go)}
.badge.flame{background:var(--flameSoft);color:var(--flame)}

.banner{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner .ico{font-size:20px;line-height:1}
.banner.flame{background:var(--flameSoft);color:#7a2e06}
.banner.ice{background:var(--iceSoft);color:#1d4466}
.banner.go{background:var(--goSoft);color:#17462a}
.banner.plain{background:var(--paper2);color:var(--ink2)}
.banner button.link{background:none;border:none;text-decoration:underline;font-size:13px;padding:0;margin-top:4px;color:inherit}
.banner .bbtn{margin-top:8px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:7px 12px;font-weight:700}

.goal{margin-bottom:12px}
.bar{height:12px;background:var(--paper3);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--flame2));border-radius:999px;transition:width .6s}
.bar.go>i{background:linear-gradient(90deg,#2a7a4a,#58b27a)}
.bar.ice>i{background:linear-gradient(90deg,#3b82c4,#7fb5e6)}
.goal-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-bottom:6px}

.preview{list-style:none;margin:12px 0 14px;border-top:1px dashed var(--rule2)}
.preview li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule2);font-size:14px}
.preview li span:last-child{color:var(--ink3);text-align:right;white-space:nowrap}

.btn{display:block;width:100%;border:none;border-radius:16px;padding:17px;font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn.primary{background:var(--flame);color:#fff;box-shadow:0 5px 0 #a83d06}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a83d06}
.btn.go{background:var(--go);color:#fff;box-shadow:0 5px 0 #1b5232}
.btn.go:active{transform:translateY(3px);box-shadow:0 2px 0 #1b5232}
.btn.ghost{background:var(--paper2);color:var(--ink2);font-size:14px;padding:13px;box-shadow:none}
.alt{display:flex;gap:8px;margin-top:10px}
.alt button{flex:1;background:none;border:1px solid var(--rule2);border-radius:12px;padding:10px 6px;font-size:13px;color:var(--ink2)}
.alt button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.quests .q{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.quests .q .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--rule2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.quests .q.done .box{background:var(--go);border-color:var(--go);color:#fff}
.quests .q.done .t{color:var(--ink4);text-decoration:line-through}
.quests .q .xp{margin-left:auto;color:var(--flame);font-weight:700;font-size:13px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:10px;letter-spacing:.08em;color:var(--ink4);text-transform:uppercase}
.week .dot{width:36px;height:36px;margin:4px auto 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--paper2);color:var(--ink4)}
.week .dot.done{background:var(--flameSoft)}
.week .dot.frozen{background:var(--iceSoft)}
.week .dot.missed{background:var(--paper2);color:var(--warn)}
.week .dot.today{outline:2px solid var(--ink);outline-offset:2px}
.week .lbl{font-size:10px;color:var(--ink3)}

.done-card{text-align:center;padding:22px 16px}
.done-card .big{font-size:54px;line-height:1}
.next-up{margin-top:10px;font-size:14px;color:var(--ink3)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--rule2);padding-bottom:var(--safe-bottom);z-index:20}
.nav button{flex:1;background:none;border:none;padding:11px 0 12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.active{color:var(--ink)}
.nav .ni{font-size:19px;line-height:1}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fffdf8;border:1px solid var(--rule);border-radius:16px;padding:14px}
.stat .v{font-family:'Lora',serif;font-size:28px;line-height:1.1}
.stat .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);margin-top:4px}
.ladder .rung{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--rule2);align-items:flex-start}
.ladder .rung:last-child{border-bottom:none}
.ladder .n{width:30px;height:30px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ladder .rung.cur .n{background:var(--flame);color:#fff}
.ladder .rung.past .n{background:var(--go);color:#fff}
.ladder .rung.locked{opacity:.55}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:7px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink4)}
.cal .done{background:var(--flame);color:#fff}
.cal .min{background:var(--flame2);color:#5a2a00}
.cal .frozen{background:#9cc3e6;color:#fff}
.cal .missed{background:var(--paper3)}
.cal .pre{background:none}
.cal .tday{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badges .b{text-align:center;padding:10px 0;border-radius:14px;background:var(--paper2);font-weight:700}
.badges .b .e{font-size:20px;display:block}
.badges .b.got{background:var(--flameSoft);color:var(--flame)}
.badges .b.lock{opacity:.45}
.spark{width:100%;height:70px}

/* settings */
label.f{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);margin:12px 0 5px}
input[type=text],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--rule2);border-radius:12px;background:#fffdf8;font-family:inherit;font-size:15px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row>button.sbtn.light[style*="flex:0"]{flex:0 0 auto}
.sbtn{background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
.sbtn.light{background:var(--paper2);color:var(--ink)}
.sbtn.danger{background:var(--warn);color:#fff}
details{border-top:1px dashed var(--rule2);padding:10px 0}
details summary{cursor:pointer;font-family:'Lora',serif;font-size:15px}
details p{font-size:13.5px;color:var(--ink2);margin-top:6px;white-space:pre-line}
code{background:var(--paper2);padding:2px 5px;border-radius:5px;font-size:12.5px;word-break:break-all}

/* overlays */
.ov{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;flex-direction:column;padding:calc(var(--safe-top) + 12px) 18px calc(var(--safe-bottom) + 18px);overflow-y:auto}
.ov.show{display:flex}
.ov .inner{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.wtop .x{background:none;border:none;font-size:26px;color:var(--ink3);width:32px}
.wtop .bar{flex:1}
.wbody{flex:1;display:flex;flex-direction:column}
.exname{font-family:'Lora',serif;font-size:28px;line-height:1.15;margin:6px 0 8px}
.rx{font-size:20px;font-weight:700;margin:12px 0 4px}
.cue{font-size:14.5px;color:var(--ink2);margin-bottom:12px}
.wt{display:flex;align-items:center;gap:10px;background:#fffdf8;border:1px solid var(--rule);border-radius:16px;padding:10px;margin:8px 0}
.wt button{width:52px;height:46px;border-radius:12px;border:none;background:var(--paper2);font-size:18px;font-weight:700}
.wt .val{flex:1;text-align:center;font-family:'Lora',serif;font-size:28px}
.wt .val small{font-family:'Inconsolata',monospace;font-size:14px;color:var(--ink3)}
.oldlog{font-size:12.5px;color:var(--ink3);text-align:center}
.sets{display:flex;gap:10px;justify-content:center;margin:18px 0}
.sets i{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule2)}
.sets i.on{background:var(--go);border-color:var(--go)}
.spacer{flex:1}
.clock{font-family:'Lora',serif;font-size:76px;text-align:center;line-height:1;margin:22px 0 6px;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.phase.work{color:var(--flame)}
.phase.ease{color:var(--go)}
.sub{text-align:center;color:var(--ink3);font-size:14px}
.skip{background:none;border:none;color:var(--ink3);text-decoration:underline;font-size:14px;padding:12px;margin-top:4px}
.rest{position:fixed;inset:0;background:#1a1714;color:var(--paper);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.rest.show{display:flex}
.rest .clock{color:var(--paper)}
.rest .skip{color:var(--paper3)}
.checkbig{display:flex;gap:12px;align-items:flex-start;background:#fffdf8;border:1px solid var(--rule);border-radius:16px;padding:16px;margin:8px 0;font-size:15px;text-align:left;width:100%}
.checkbig .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--rule2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.checkbig.on .box{background:var(--go);border-color:var(--go);color:#fff}

/* finish */
.center{text-align:center}
.feel{display:flex;gap:10px;margin-top:18px}
.feel button{flex:1;border:1px solid var(--rule2);background:#fffdf8;border-radius:16px;padding:16px 4px;font-size:14px}
.feel button span{display:block;font-size:30px;margin-bottom:4px}
.flamebig{font-size:96px;line-height:1;margin-top:20px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.streaknum{font-family:'Lora',serif;font-size:56px;color:var(--flame);line-height:1;margin-top:10px}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.tally{margin:16px auto;max-width:320px;text-align:left}
.tally div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--rule2);font-size:14.5px}
.tally div b{color:var(--flame)}
.chest{font-size:84px;background:none;border:none;margin:10px auto;display:block;animation:wiggle 1.2s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.tip{background:var(--paper2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);margin:10px 0}

.sheet{position:fixed;inset:0;background:rgba(26,23,20,.45);z-index:70;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .panel{background:var(--paper);border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-bottom) + 18px);width:100%;max-width:560px}
.sheet .panel h3{font-family:'Lora',serif;font-weight:500;font-size:19px;margin-bottom:6px}
.sheet .panel .btn{margin-top:10px}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
</style>
</head>
<body>

<section class="view active" id="v-today"></section>
<section class="view" id="v-progress"></section>
<section class="view" id="v-settings"></section>

<nav class="nav">
  <button data-v="today" class="active"><span class="ni">🔥</span>Today</button>
  <button data-v="progress"><span class="ni">📈</span>Progress</button>
  <button data-v="settings"><span class="ni">⚙️</span>Settings</button>
</nav>

<div class="ov" id="ov-workout"><div class="inner" id="w-inner"></div></div>
<div class="ov" id="ov-finish"><div class="inner" id="f-inner"></div></div>
<div class="ov" id="ov-onboard"><div class="inner" id="o-inner"></div></div>
<div class="rest" id="rest"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheet-panel"></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ═══════════════════════ DATES ═══════════════════════ */
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dkey(d); };
const dowOf = k => new Date(k + 'T12:00:00').getDay();
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const today = () => dkey();
const prettyDate = k => new Date(k + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const shortDate = k => new Date(k + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ═══════════════════════ STATE ═══════════════════════ */
const LS = 'showup_v1', OURA_TOKEN = 'showup_oura', OURA_CACHE = 'showup_oura_cache';
const defaults = () => ({
  startDate: null, goal: 7, history: {}, weights: {}, seenMilestones: [], modeOverride: {},
  settings: { skiDate: '2027-02-17', travel: [{ from: '2026-12-24', to: '2027-01-03' }], ouraClientId: '', stage: 'auto' }
});
let S = loadState();
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s) { const d = defaults(); return Object.assign(d, s, { settings: Object.assign(d.settings, s.settings || {}) }); }
  } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

/* ═══════════════════════ YOUR PLAN (from Google Calendar → Other Calendar) ═══════════════════════ */
const DAYS = {
  0: { n: 1, title: 'Long Endurance', short: 'Zone 2', kind: 'zone2',
       cal: '>30 minutes Zone 2 cardio, ideally 60–75 minutes (work up to it).\nZone 2: breathing faster than normal, but just able to hold a conversation.\nAim for 180–200 minutes of Zone 2 per week.\nJogging, rowing, cycling, swimming, hiking. Add a weighted vest or backpack to progress.\nEmphasize nasal breathing when possible.' },
  1: { n: 2, title: 'Legs', short: 'Legs', kind: 'strength', order: ['legpress', 'dbrdl', 'goblet', 'calfstand', 'calfseat'],
       cal: '10-minute warmup + 50–60 minutes training. Alternate Schedule A & B monthly.\nQuads: leg extension / hack squats\nHamstrings: leg curls / glute-ham raises\nCalves: standing raises / seated raises\nSchedule A: ~4–8 reps, 3–4 sets, 2–4 min rest\nSchedule B: ~8–15 reps, 2–3 sets, ~90 s rest' },
  2: { n: 3, title: 'Heat & Cold Recovery', short: 'Recover', kind: 'recovery',
       cal: 'Sauna (20 minutes) + ice bath / cold shower (5 minutes), repeat 3–5×.' },
  3: { n: 4, title: 'Torso & Neck', short: 'Torso', kind: 'strength', order: ['cablerow', 'inclinedb', 'dbpress', 'crossover', 'dbrow', 'lateral', 'reardelt', 'neck'],
       cal: '10-minute warmup + 50–60 minutes training. Push/pull. Alternate Schedule A & B monthly.\nChest: incline press / cable crossover\nBack: chin-up or pull-up / seated row or dumbbell row\nShoulders: shoulder press / lateral raises, rear delt flies\nNeck exercises (reduces injury risk, helps posture)' },
  4: { n: 5, title: 'Cardiovascular', short: 'Cardio', kind: 'cardio',
       cal: '35 minutes of moderate-intensity cardio at 75–80% of max effort.\nRunning, rowing, cycling, jumping jacks, stair climb, jump rope — ideally outside.' },
  5: { n: 6, title: 'Arms, Neck & Calves', short: 'Arms', kind: 'strength', order: ['inclinecurl', 'ohtri', 'bbcurl', 'benchdip', 'calfstand', 'tib', 'neck'],
       cal: '10-minute warmup + 50–60 minutes training. Alternate Schedule A & B.\nBiceps: incline curl / dumbbell curls\nTriceps: overhead extensions / dips\nCalves: standing / seated raises, tibialis raises\nNeck exercises' },
  6: { n: 7, title: 'HIIT', short: 'HIIT', kind: 'hiit',
       cal: '20–60 seconds all-out sprint + 10 seconds rest × 8–12 rounds.\nAssault bike, sprint intervals, rowing, ski machine. Pick something you can do with perfect form.' }
};

/* Exercises mapped to Rafter gym equipment. w = weight you last logged (lb). */
const NECK_VIDEO = 'https://youtu.be/wjiZaCJ6tCA';
const EX = {
  legpress:   { name: 'Leg press', w: 125, setting: 'Setting 8', cue: 'Feet shoulder-width. Lower until knees hit about 90°, press without locking out.' },
  dbrdl:      { name: 'Dumbbell Romanian deadlift', w: null, cue: 'Soft knees, push hips back, feel the hamstring stretch, stand tall. (Covers hamstrings since there\'s no leg-curl machine.)' },
  goblet:     { name: 'Goblet squat', w: null, cue: 'Hold a kettlebell at your chest. Sit down between your heels, chest tall.' },
  calfstand:  { name: 'Standing calf raise', w: 35, cue: 'Full stretch at the bottom, 1-second pause at the top.' },
  calfseat:   { name: 'Seated calf raise', w: null, cue: 'Sit on a bench with a dumbbell on your knees. Slow and full range.' },
  cablerow:   { name: 'Seated cable row', w: 120, cue: 'Chest tall, pull to your belly button, squeeze shoulder blades.' },
  inclinedb:  { name: 'Incline dumbbell press', w: null, cue: 'Bench at ~30°. Lower slowly to a deep stretch. (Chest press machine works too; you logged 70 lb.)' },
  dbpress:    { name: 'Dumbbell shoulder press', w: null, cue: 'Seated, back supported. Press up, don\'t flare the ribs.' },
  crossover:  { name: 'Cable crossover', w: null, cue: 'Slight forward lean, hug a tree, squeeze at the middle.' },
  dbrow:      { name: 'Single-arm dumbbell row', w: null, cue: 'Hand and knee on the bench. Pull the elbow to your hip.' },
  lateral:    { name: 'Lateral raise', w: null, cue: 'Light. Raise to shoulder height, lead with the elbows.' },

/* ═══════════════════════ STATS: streaks, freezes, stages ═══════════════════════ */
function stats(t = today()) {

      if (r.streak % 7 === 0 && r.freezes < 2) r.freezes++;
      if (h.freezeDrop && r.freezes < 2) r.freezes++;
      if (d === t) r.doneToday = true;
    } else if (d < t) {
      if (r.freezes > 0) { r.freezes--; r.frozen.add(d); }
      else { r.streak = 0; r.missed.add(d); }
    }
    r.best = Math.max(r.best, r.streak);
    if (dowOf(d) === 6 && d < t) { let all = true; for (let i = 0; i < 7; i++) { const x = addDays(d, -i); if (x < S.startDate || !(S.history[x] && S.history[x].done)) all = false; } if (all) r.perfectWeeks++; }

  r.missedYesterday = y >= S.startDate && !(S.history[y] && S.history[y].done);

}
// Lally et al. 2010: automaticity rises along an asymptotic curve, fastest early. ~66 reps to plateau.
const K = 0.045;

function stageInfo(t = today()) {
  const out = { stage: 1, q: 0, weekDone: 0, weekNeed: 5, auto: 1 };
  if (!S.startDate) return out;
  const curWs = addDays(t, -dowOf(t));
  for (let ws = addDays(S.startDate, -dowOf(S.startDate)); ws < curWs; ws = addDays(ws, 7)) {
    let avail = 0, cnt = 0;
    for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d < S.startDate) continue; avail++; if (S.history[d] && S.history[d].done) cnt++; }
    if (avail >= 3 && cnt >= weekNeed(avail)) out.q++;
  }
  let avail = 0;
  for (let i = 0; i < 7; i++) { const d = addDays(curWs, i); if (d < S.startDate) continue; avail++; if (d <= t && S.history[d] && S.history[d].done) out.weekDone++; }
  out.weekNeed = weekNeed(avail);

  out.stage = S.settings.stage === 'auto' ? out.auto : +S.settings.stage;
  return out;
}

/* ═══════════════════════ WORKOUT BUILDER ═══════════════════════ */
function suggestWeight(id, stage) {

}
function strengthRx(stage) {

  if (stage === 2) return { sets: 2, reps: '10–15', rest: 90, warm: 5, note: 'Schedule B style: moderate weight, smooth reps.' };
  if (stage === 3) return { sets: 3, reps: '8–12', rest: 90, warm: 5, note: 'Three working sets. Last reps should feel hard but clean.' };

function isTravel(k) { return (S.settings.travel || []).some(r => r.from && r.to && k >= r.from && k <= r.to); }

function buildWorkout(k, stage, mode) {

    else ['bwsquat', 'pushup', 'revlunge', 'bridge', 'plank'].forEach(id => steps.push({ type: 'sets', ex: id, sets: stage === 1 ? 2 : 3, reps: EX[id].reps, rest: 45 }));
  } else if (mode === 'min') {
    label = '5-minute version';
    note = 'Small days keep the streak alive. That\'s the whole point.';
    if (D.kind === 'strength') D.order.slice(0, 2).forEach(id => steps.push({ type: 'sets', ex: id, sets: 1, reps: EX[id].reps || '12', rest: 45 }));
    else if (D.kind === 'recovery') steps.push({ type: 'flow', title: 'Mobility', moves: FLOW.slice(0, 5), secs: 60 });

  } else {

        if (P.sched) label += ` · Schedule ${P.sched}`;
        steps.push({ type: 'timer', title: 'Warm-up', minutes: P.warm, detail: 'Easy bike or rower. Get warm, not tired.' });
        (P.count ? D.order.slice(0, P.count) : D.order).forEach(id =>
          steps.push({ type: 'sets', ex: id, sets: id === 'neck' ? 2 : P.sets, reps: EX[id].reps || P.reps, rest: id === 'neck' ? 45 : P.rest }));
        break;
      }
      case 'zone2':
        steps.push({ type: 'timer', title: 'Zone 2 treadmill', minutes: [15, 30, 45, 60][stage - 1], detail: 'Treadmill 3.5 mph at 4.5% incline (your old Zone 2 setting). You should be able to talk. Nasal breathing if you can.' });
        note = stage < 4 ? 'Working up to 60–75 min on the full plan.' : 'Add a weighted vest or backpack when this feels easy.';
        break;
      case 'cardio':
        steps.push({ type: 'timer', title: 'Moderate cardio', minutes: [12, 20, 30, 35][stage - 1], detail: 'Rower, bike or stair climber at about 75–80% effort. Hard to talk, but steady.' });
        break;
      case 'hiit':

        } else if (stage === 2) {
          steps.push({ type: 'flow', title: 'Mobility flow', moves: FLOW, secs: 60 });
          steps.push({ type: 'check', title: 'Cold finish: 60–90 seconds', detail: 'End your shower cold.' });
          steps.push({ type: 'check', title: 'Sauna 10 min (optional)', detail: 'Only if you have access.', optional: true });
        } else {

          steps.push({ type: 'check', title: 'Sauna 20 min → cold 5 min, repeat 3×', detail: 'No sauna? Cold finish of 2–3 minutes instead.',
            links: [['Heat protocol', 'https://hubermanlab.com/deliberate-heat-exposure-protocols-for-health-and-performance/'], ['Cold protocol', 'https://hubermanlab.com/the-science-and-use-of-cold-exposure-for-health-and-performance/']] });

function estMinutes(steps) {

const redirectUri = () => location.origin + location.pathname;
function ouraToken() { try { const o = JSON.parse(localStorage.getItem(OURA_TOKEN)); if (o && o.token && o.expires > Date.now()) return o; } catch (e) {} return null; }

  const st = Math.random().toString(36).slice(2);
  sessionStorage.setItem('oura_state', st);
  location.href = 'https://cloud.ouraring.com/oauth/authorize?' + new URLSearchParams({ response_type: 'token', client_id: id, redirect_uri: redirectUri(), scope: 'personal daily heartrate workout', state: st });
}
function handleOuraRedirect() {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token')) {
    const want = sessionStorage.getItem('oura_state');
    if (want && h.get('state') !== want) toast('Oura sign-in didn\'t match. Try again.');
    else {
      localStorage.setItem(OURA_TOKEN, JSON.stringify({ token: h.get('access_token'), expires: Date.now() + (+h.get('expires_in') || 2592000) * 1000 }));
      toast('Oura connected');
    }

}
async function ouraGet(path, params, token) {
  const r = await fetch('https://api.ouraring.com/v2/usercollection/' + path + '?' + new URLSearchParams(params), { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { localStorage.removeItem(OURA_TOKEN); throw new Error('Oura sign-in expired. Reconnect in Settings.'); }

async function ouraRefresh(force) {
  const tk = ouraToken(); if (!tk || ouraBusy) return;

      ouraGet('sleep', { start_date: addDays(t, -60), end_date: end }, tk.token),

    ]);

    const byDay = {};

    const series = Object.keys(byDay).sort().map(d => ({ day: d, rhr: byDay[d].lowest_heart_rate, hrv: byDay[d].average_hrv }));
    const ln = byDay[t];

function curveSvg(cur) {
  const W = 320, H = 90, maxX = 110;

  const cx = Math.min(maxX, -Math.log(1 - Math.min(cur, 0.999)) / K) / maxX * W, cy = H - 8 - cur * (H - 16);
  const x66 = 66 / maxX * W;
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" style="height:90px;margin:10px 0">
    <line x1="${x66}" y1="4" x2="${x66}" y2="${H - 4}" stroke="#c8bfb4" stroke-dasharray="3 3"/>
    <text x="${x66 + 4}" y="14" font-size="10" fill="#a09890" font-family="Inconsolata">66 days</text>
    <path d="${p}" fill="none" stroke="#2a7a4a" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#e8590c" stroke="#fff" stroke-width="2"/></svg>`;
}
function sparkCard(label, vals, unit, lowerBetter) {
  const v = vals.filter(x => x != null); if (v.length < 3) return '';
  const W = 320, H = 60, mn = Math.min(...v), mx = Math.max(...v), rng = Math.max(1, mx - mn);
  const pts = v.map((y, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - 6 - (y - mn) / rng * (H - 12)).toFixed(1)}`).join(' ');
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  const recent = avg(v.slice(-7)), early = avg(v.slice(0, 7));
  const better = lowerBetter ? recent < early : recent > early;
  return `<div style="margin:6px 0 12px"><div class="goal-row"><span>${label}</span><span style="color:${better ? 'var(--go)' : 'var(--ink3)'}">7-night avg ${Math.round(recent)} ${unit}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#3b82c4" stroke-width="2"/></svg></div>`;
}

        T.p++; T.left = T.phases[T.p].secs; T.endsAt = Date.now() + T.left * 1000;
        beep(T.phases[T.p].cls === 'work' ? 1200 : 700, 260); renderStep(); return;
      }
      T.running = false; T.left = 0; clearInterval(tick); beep(1040, 400); setTimeout(() => beep(1040, 400), 450);
      const s = document.getElementById('csub'); if (s) s.textContent = 'Time! Tap done when you\'re ready.';
      const b = document.getElementById('tbtn'); if (b) b.style.display = 'none';
      const c = document.getElementById('clock'); if (c) c.textContent = '0:00';
      return;
    }
    const c = document.getElementById('clock'); if (c) c.textContent = fmt(left);
  }, 250);
}
function nextStep() {
  clearInterval(tick); endRest();
  W.completed++;
  W.i++; W.setsDone = 0; W.timer = null;
  if (W.i >= W.steps.length) { finishWorkout(); return; }
  renderStep();
}
function quitWorkout() {
  const did = W.completed > 0 || W.setsDone > 0 || (W.timer && W.timer.started);
  sheet(`<h3>Leave the workout?</h3>
    ${did ? '<div class="small muted">You already did some of it. That counts for the streak.</div><button class="btn go" onclick="closeSheet();finishWorkout(\'partial\')">Count what I did</button>' : '<div class="small muted">Even the 5-minute version keeps your streak.</div><button class="btn go" onclick="closeSheet();exitWorkout();setMode(\'min\');startWorkout()">Do 5 minutes instead</button>'}
    <button class="btn ghost" onclick="closeSheet()">Keep going</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();exitWorkout()">Leave</button>`);
}
function exitWorkout() {
  clearInterval(tick); endRest();
  document.getElementById('ov-workout').classList.remove('show');
  try { wakeLock && wakeLock.release(); } catch (e) {}
  W = null; render();
}

/* ═══════════════════════ FINISH + REWARDS ═══════════════════════ */
const TIPS = [
  'The first few weeks build the habit fastest. Every rep now counts double.',
  'Missing one day doesn\'t meaningfully slow habit formation. Missing two in a row is where habits slip.',
  'Same cue, same place, every morning. That\'s how a habit becomes automatic.',
  'Pair it with something you enjoy: save a favorite podcast for workout time only.',
  'Consistency beats intensity. The best plan is the one you keep doing.',
  'Lay your gym clothes out tonight. One less decision in the morning.',
  'Zone 2 is supposed to feel easy. If you can\'t talk, slow down.',
  'Ski legs come from leg day and Zone 2. Every Monday and Sunday counts.',
  'Rest days aren\'t in this plan on purpose: a daily cue builds the habit faster.',
  'Your resting heart rate will drift down over months. Check the Oura trend.'
];
function finishWorkout(kind) {
  clearInterval(tick); endRest();
  try { wakeLock && wakeLock.release(); } catch (e) {}
  const t = today();
  if (!S.startDate || S.startDate > t) S.startDate = t;
  const before = stats(t);
  const mode = kind === 'partial' ? 'min' : W ? W.mode : 'planned';
  const base = mode === 'planned' ? 20 : mode === 'travel' ? 15 : 10;
  const comeback = before.missedYesterday && before.done > 0;
  const early = new Date().getHours() < 7, full = mode === 'planned' && kind !== 'partial';
  const chest = 5 + Math.floor(Math.random() * 21);
  const freezeDrop = before.freezes < 2 && Math.random() < 1 / 12;
  const xp = base * (comeback ? 2 : 1) + (early ? 10 : 0) + (full ? 10 : 0) + chest;
  S.history[t] = { done: true, mode, stage: W ? W.stage : stageInfo(t).stage, at: new Date().toISOString(), xp, comeback, chest, freezeDrop, quests: { early, full, feel: false } };
  save();
  document.getElementById('ov-workout').classList.remove('show');
  W = null;
  const after = stats(t);
  showFinish({ base, comeback, early, full, chest, freezeDrop, after, before });
}
function showFinish(r) {
  const el = document.getElementById('f-inner');
  document.getElementById('ov-finish').classList.add('show');
  el.innerHTML = `<div class="center" style="margin-top:30px">
    <div class="eyebrow">Workout complete</div>
    <h2 class="serif" style="font-weight:500;font-size:28px;margin-top:6px">How did that feel?</h2>
    <div class="feel">
      <button onclick="feel(1)"><span>😮‍💨</span>Rough</button>
      <button onclick="feel(2)"><span>🙂</span>Solid</button>
      <button onclick="feel(3)"><span>💪</span>Great</button>
    </div></div>`;
  window._fin = r;
}
function feel(v) {
  const t = today(), h = S.history[t];
  h.feel = v; h.quests.feel = true; h.xp += 5; save();
  const r = window._fin, st = stats(t);
  const tip = TIPS[Math.floor(Math.random() * TIPS.length)];
  const el = document.getElementById('f-inner');
  el.innerHTML = `<div class="center">
    <div class="flamebig">🔥</div>
    <div class="streaknum">${st.streak}</div>
    <div class="eyebrow">day streak</div>
    <div class="tally">
      <div><span>Workout</span><b>+${r.base}</b></div>
      ${r.comeback ? `<div><span>Comeback bonus (2×)</span><b>+${r.base}</b></div>` : ''}
      ${r.early ? '<div><span>Quest: early bird</span><b>+10</b></div>' : ''}
      ${r.full ? '<div><span>Quest: planned session</span><b>+10</b></div>' : ''}
      <div><span>Quest: check-in</span><b>+5</b></div>
    </div>
    <div id="chestzone"><div class="small muted">Tap the chest</div><button class="chest" onclick="openChest()">🎁</button></div>
  </div>`;
  confetti(60);
}
function openChest() {
  const r = window._fin, t = today(), st = stats(t);
  const tip = TIPS[Math.floor(Math.random() * TIPS.length)];
  document.getElementById('chestzone').innerHTML = `
    <div style="font-size:56px;margin-top:6px">${r.freezeDrop ? '❄️' : '⚡'}</div>
    <div class="serif" style="font-size:22px">+${r.chest} XP${r.freezeDrop ? ' and a streak freeze!' : ''}</div>
    <div class="tip">${esc(tip)}</div>
    <button class="btn primary" style="margin-top:8px" onclick="afterChest()">Continue</button>`;
  confetti(r.freezeDrop ? 140 : 40);
}
function afterChest() {
  const st = stats();
  const m = MILESTONES.filter(x => st.streak >= x && !S.seenMilestones.includes(x)).pop();
  if (m) {
    MILESTONES.filter(x => x <= st.streak).forEach(x => { if (!S.seenMilestones.includes(x)) S.seenMilestones.push(x); });
    save();
    const goalHit = st.streak >= S.goal;
    const nextGoal = [7, 14, 30, 66, 100, 365].find(x => x > S.goal) || S.goal;
    document.getElementById('f-inner').innerHTML = `<div class="center" style="margin-top:40px">
      <div class="flamebig">🏆</div>
      <h2 class="serif" style="font-weight:500;font-size:30px;margin-top:12px">${m}-day streak!</h2>
      <div class="muted" style="margin-top:8px">${milestoneLine(m)}</div>
      ${goalHit && nextGoal !== S.goal ? `<div class="card" style="margin-top:22px;text-align:left"><h3>Goal reached. Commit to ${nextGoal}?</h3>
        <button class="btn primary" onclick="S.goal=${nextGoal};save();closeFinish()">Commit to ${nextGoal} days</button></div>` : `<button class="btn primary" style="margin-top:26px" onclick="closeFinish()">Keep going</button>`}
    </div>`;
    confetti(220);
    return;
  }
  document.getElementById('f-inner').innerHTML = `<div class="center" style="margin-top:60px">
    <div style="font-size:64px">🚿</div>
    <h2 class="serif" style="font-weight:500;font-size:26px;margin-top:10px">Shower's next. Then coffee.</h2>
    <div class="muted" style="margin-top:8px">See you tomorrow after you brush your teeth.</div>
    <button class="btn primary" style="margin-top:28px" onclick="closeFinish()">Done</button></div>`;
}
function milestoneLine(m) {
  return ({ 3: 'Three in a row. The hardest part is behind you.', 7: 'A full week. People who hit 7 days are far more likely to keep going.', 14: 'Two weeks. This is turning into who you are.', 30: 'A month of mornings.', 50: 'Fifty. Most people never get here.', 66: '66 days: about how long a habit takes to become automatic.', 100: 'Triple digits.', 150: 'One hundred fifty mornings.', 200: 'Two hundred.', 365: 'A full year. Legendary.' })[m] || '';
}
function closeFinish() { document.getElementById('ov-finish').classList.remove('show'); todayMode = null; render(); }
function logYesterday() {
  const y = addDays(today(), -1);
  S.history[y] = { done: true, mode: 'logged', stage: stageInfo(y).stage, at: new Date().toISOString(), xp: 10, quests: {} };
  save(); toast('Logged yesterday'); render();
}
function logOuraWorkout() {
  W = null; todayMode = 'planned';
  finishWorkout();
}

/* ═══════════════════════ ONBOARDING ═══════════════════════ */
function onboard() {
  document.getElementById('ov-onboard').classList.add('show');
  document.getElementById('o-inner').innerHTML = `<div style="margin-top:36px">
    <div style="font-size:64px">🔥</div>
    <h1 class="serif" style="font-weight:500;font-size:34px;line-height:1.15;margin-top:12px">Show up.<br>That's the whole game.</h1>
    <div class="card" style="margin-top:22px">
      <div class="eyebrow">Your one rule</div>
      <h3 style="margin-top:6px;font-size:19px">After I brush my teeth, I put on gym clothes and go down to the gym.</h3>
      <div class="small muted">Then shower, then coffee. Start with 10–15 minutes and ramp toward your full plan only once the habit holds.</div>
    </div>
    <div class="small muted" style="margin:6px 2px 12px">Commit to a streak goal:</div>
    <button class="btn primary" onclick="commit(7)">I commit to 7 days</button>
    <div class="alt"><button onclick="commit(14)">14 days</button><button onclick="commit(30)">30 days</button></div>
  </div>`;
}
function commit(n) {
  // Committing late in the evening? Start tomorrow so tonight doesn't count as a miss.
  S.goal = n; S.startDate = S.startDate || (new Date().getHours() >= 18 ? addDays(today(), 1) : today()); save();
  document.getElementById('ov-onboard').classList.remove('show');
  confetti(80); render();
}

/* ═══════════════════════ UI UTIL ═══════════════════════ */
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function sheet(html) { document.getElementById('sheet-panel').innerHTML = html; document.getElementById('sheet').classList.add('show'); }
function closeSheet() { document.getElementById('sheet').classList.remove('show'); }
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function confetti(n) {
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#e8590c', '#ffb347', '#2a7a4a', '#3b82c4', '#f5c542'];
  const P = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, life: 0 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 110) requestAnimationFrame(loop); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
let currentView = 'today';
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => {
  currentView = b.dataset.v;
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + currentView));
  render(); scrollTo(0, 0);
}));
function render() {
  if (currentView === 'today') renderToday();
  else if (currentView === 'progress') renderProgress();
  else renderSettings();
}
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (today() !== lastDay) { lastDay = today(); todayMode = null; }
  if (!W) render();
  ouraRefresh(false);
});

/* ═══════════════════════ BOOT ═══════════════════════ */
handleOuraRedirect();
if (S.modeOverride && !S.modeOverride[today()]) { S.modeOverride = {}; save(); }
render();
if (!S.startDate) onboard();
ouraRefresh(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
